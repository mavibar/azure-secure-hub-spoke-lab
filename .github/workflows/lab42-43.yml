name: Days 42-43 OIDC and plan

on:
  push:
    branches: [feat/day42-43-oidc-plan]

permissions:
  contents: read

concurrency:
  group: csl-day42-43-plan
  cancel-in-progress: false

jobs:
  inspect-or-plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/day42-43-oidc-plan'
    environment: csl-plan
    runs-on: macos-15-intel
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_CORE_ONLY_SHOW_ERRORS: "true"
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set private Azure CLI directory
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/day42-43-azure" >> "$GITHUB_ENV"
      - name: Inspect trust claims
        if: vars.LAB_PLAN_READY != 'true'
        run: python3 exercises/day42-43/scripts/oidc_claims.py
      - name: Sign in with the federated identity
        if: vars.LAB_PLAN_READY == 'true'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
          enable-AzPSSession: false
      - name: Set up Terraform
        if: vars.LAB_PLAN_READY == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Prove access and create the private plan
        if: vars.LAB_PLAN_READY == 'true'
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_USE_CLI: "false"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          LAB_RESOURCE_GROUP: ${{ secrets.LAB_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ secrets.TFSTATE_CONTAINER }}
          TFSTATE_RESOURCE_GROUP: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
        run: python3 exercises/day42-43/scripts/secure_plan.py
      - name: Retain only the approved review summary for one day
        if: success() && vars.LAB_PLAN_READY == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day42-43-plan-review
          path: ${{ runner.temp }}/day42-43-review/review.txt
          if-no-files-found: error
          retention-days: 1
      - name: Remove local session and plan material
        if: always()
        run: python3 exercises/day42-43/scripts/secure_plan.py --cleanup
