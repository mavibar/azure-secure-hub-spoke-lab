name: Days 40-41 investigations

on:
  pull_request:
    branches:
      - main
    paths:
      - exercises/day40-41/**
      - .github/workflows/lab40-41.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive exercises/day40-41
      - name: Initialize provider schemas
        working-directory: exercises/day40-41/terraform
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        working-directory: exercises/day40-41/terraform
        run: terraform validate -no-color

  rdp-policy:
    name: RDP policy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: python -m pip install checkov==3.4.4
      - name: Check RDP exposure
        run: checkov --file exercises/day40-41/security-fixture/main.tf --framework terraform --check CKV_AZURE_9 --skip-download
